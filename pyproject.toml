[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "A 1st Project on personnal computer"
authors = [
  { name = "Valentin LAURENT" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"
dependencies = [
    "pydantic_settings==2.11.0",
    "nest-asyncio==1.6.0",
    "uvicorn==0.37.0",
    "gradio==5.49.1",
    "pymupdf==1.26.5",
    "pymupdf4llm==0.0.27",
    "llama-index==0.14.4",
    "llama-index-multi-modal-llms-azure-openai==0.5.1",
    "llama-index-embeddings-azure-openai==0.4.1",
    "llama-index-vector-stores-qdrant==0.8.6",
    "llama-index-readers-file==0.5.4",
    "llama_index.embeddings-clip==0.5.1",
    "llama_index.embeddings.huggingface_api==0.4.1",
    "llama_index.llms.huggingface_api==0.6.1",
    "spacy==3.8.7",
    "transformers==4.57.1",
    "clip",
    "llama-index-core==0.14.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "prek",
    "ruff",
    "ty",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["src"]
force_sort_within_sections = true



[tool.uv]
package = false

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
