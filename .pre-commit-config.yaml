# Les outils et leurs versions sont gérés par uv.lock.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff (lint)
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff (format)
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ty-check
        name: ty check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
