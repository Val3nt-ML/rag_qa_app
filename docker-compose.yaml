services:
  rag_app:
    image: rag_app:latest
    build: 
      context: .
    environment:
      - PYTHONPATH=/app/src
    command: python /app/src/app.py
    ports:
      - "7860:7860"
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s